name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    # The next Ruby release is tested but never blocks a merge.
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", head]
    env:
      BUNDLE_WITHOUT: docs:lint:typecheck
      # Coverage and signature checks run on one Ruby version only.
      COVERAGE: ${{ matrix.ruby == '4.0' && '1' || '' }}
      RAKE_TASK: ${{ matrix.ruby == '4.0' && 'spec:rbs' || 'default' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ruby head comes with a newer Bundler than the one named in
      # Gemfile.lock and can't run the older one. Tell Bundler to stay on
      # the version it came with.
      - if: matrix.ruby == 'head'
        run: echo "BUNDLE_VERSION=system" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.ruby == 'head' && 'default' || 'Gemfile.lock' }}
          bundler-cache: true
      # spec:rbs runs the specs with rbs test, checking every call into the
      # gem against the signatures in sig/.
      - run: bundle exec rake "$RAKE_TASK"
      - name: Upload coverage to Coveralls
        if: matrix.ruby == '4.0'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/.resultset.json
          format: simplecov
          # The action downloads this uploader when it runs. Pin it rather
          # than take the latest release. Dependabot doesn't update it.
          coverage-reporter-version: v0.6.22
          # A Coveralls outage shouldn't fail the tests.
          fail-on-error: false
