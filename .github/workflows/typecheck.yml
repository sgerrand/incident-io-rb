name: Type check

# Only runs when something Steep checks, or its setup, changes. Changes to
# the generator show up here through the code it writes to lib/ and sig/.
on:
  push:
    branches: [main]
    paths: &paths
      - "lib/**"
      - "sig/**"
      - "typecheck/**"
      - "Steepfile"
      - "Gemfile"
      - "incident-io.gemspec"
      - ".github/workflows/typecheck.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Steep
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: docs:lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake typecheck
