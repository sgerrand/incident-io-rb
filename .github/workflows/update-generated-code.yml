name: Update generated code

# Fetches the latest incident.io OpenAPI spec, regenerates the models and
# resources, and opens (or updates) a pull request when they change.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/update-generated-code
      BUNDLE_WITHOUT: docs:lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Fetch spec and regenerate
        run: bundle exec rake openapi:fetch generate

      # `rake generate` only writes the generated files, and the spec it
      # reads is ignored by git, so any change in the tree is generated.
      # Staged now so files written by later steps aren't committed.
      - name: Check for changes
        id: changes
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Generated code is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The pull request lists the changes that can break code that uses
      # the gem: anything removed, fields that changed type or allow other
      # values, and methods whose arguments or return type changed.
      # Compares with the last commit, so it runs before the new code is
      # committed.
      - name: List breaking changes
        if: steps.changes.outputs.changed == 'true'
        run: bundle exec rake generate:breaking > "$RUNNER_TEMP/breaking.md"

      # Pull requests opened with GITHUB_TOKEN don't trigger the Test
      # workflow, so run the specs here before opening one.
      - name: Run specs and type check
        if: steps.changes.outputs.changed == 'true'
        run: bundle exec rake spec typecheck

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The write token is only handed to git here, after the code from
        # the repo and the spec has run.
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$BRANCH"
          git commit --message "feat: update generated code from the latest OpenAPI spec"

          # The part of the pull request's text that every run rewrites. It
          # names its commit, so a list that is out of date is easy to spot.
          {
            echo "<!-- breaking-changes:start -->"
            echo "<!-- The update workflow rewrites this part on every run. Write your notes outside it. -->"
            if [ -s "$RUNNER_TEMP/breaking.md" ]; then
              cat "$RUNNER_TEMP/breaking.md"
              echo
              echo "This list is for commit $(git rev-parse HEAD)."
            else
              echo "No breaking changes were found in commit $(git rev-parse HEAD)."
            fi
            echo "<!-- breaking-changes:end -->"
          } > "$RUNNER_TEMP/section.md"

          # An open pull request keeps its text, so anything a person
          # added to it is kept too.
          state="$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)"
          if [ "$state" = "OPEN" ]; then
            gh pr view "$BRANCH" --json body --jq .body > "$RUNNER_TEMP/text.md"
          else
            cat > "$RUNNER_TEMP/text.md" <<'BODY'
          :tipping_hand_person: These changes update the generated models, resources and signatures from the latest incident.io OpenAPI spec.

          The spec itself is not stored in git, so review the changes to the generated code. The workflow ran the specs before it pushed this code, and they passed.

          The Test workflow does not run on pull requests opened by GitHub Actions. To run it, close and reopen this pull request.
          BODY
          fi

          # Puts the new part in place of the old one, or at the end of a
          # text that has none.
          ruby -e '
            text, section = ARGV.map { |path| File.read(path) }
            marked = /<!-- breaking-changes:start -->.*<!-- breaking-changes:end -->\r?\n?/m
            print text.match?(marked) ? text.sub(marked) { section } : "#{text.rstrip}\n\n#{section}"
          ' "$RUNNER_TEMP/text.md" "$RUNNER_TEMP/section.md" > "$RUNNER_TEMP/body.md"

          # Everything that can fail before the push has run by now. The
          # text is written last, as it describes the pushed code.
          git push --force origin "$BRANCH"

          if [ "$state" = "OPEN" ]; then
            if ! gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"; then
              echo "::error::The text of the pull request was not updated, so its list of breaking changes is out of date. Run this workflow again to fix it."
              exit 1
            fi
            echo "Updated the open pull request."
          else
            gh pr create \
              --base "$GITHUB_REF_NAME" \
              --head "$BRANCH" \
              --title "feat: update generated code from the latest OpenAPI spec" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
